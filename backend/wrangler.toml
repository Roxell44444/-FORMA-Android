name = "formaandroid"
main = "worker.js"
compatibility_date = "2026-11-20"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://appassets.androidplatform.net"

# Approximate per-IP limits. Cloudflare counters are local to each edge location.
[[ratelimits]]
name = "COACH_RATE_LIMITER"
namespace_id = "1701"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "SCAN_RATE_LIMITER"
namespace_id = "1702"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "CLAD_POLL_RATE_LIMITER"
namespace_id = "1703"
[ratelimits.simple]
limit = 40
period = 60

