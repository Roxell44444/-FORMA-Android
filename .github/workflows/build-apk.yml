name: Build FORMA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'FORMA-ANDROID-APK-BUILDER-1.1.0.zip'
      - 'assets/forma-app-icon.webp'
      - 'scripts/forma-redesign.py.gz'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare FORMA 1.2
        run: |
          test -f FORMA-ANDROID-APK-BUILDER-1.1.0.zip
          unzip -q FORMA-ANDROID-APK-BUILDER-1.1.0.zip
          gzip -dc scripts/forma-redesign.py.gz > scripts/forma-redesign.py
          python3 scripts/forma-redesign.py
          cp assets/forma-app-icon.webp FORMA-1.1.0/public/icon.webp
          mkdir -p FORMA-1.1.0/android/app/src/main/res/drawable-nodpi
          cp assets/forma-app-icon.webp FORMA-1.1.0/android/app/src/main/res/drawable-nodpi/forma_launcher.webp
          sed -i 's/vision_bundle.mjs/vision_bundle.js/g' FORMA-1.1.0/src/scanner/pose.js FORMA-1.1.0/service-worker.js

      - name: Inspect packaged FORMA source
        run: |
          echo '=== FILE INVENTORY ==='
          find FORMA-1.1.0 -maxdepth 4 -type f | sort | head -240
          echo '=== PACKAGE ==='
          cat FORMA-1.1.0/package.json
          echo '=== APP SOURCE SIZE ==='
          wc -l FORMA-1.1.0/src/app.js FORMA-1.1.0/index.html
          echo '=== SOURCE ENTRYPOINTS ==='
          for f in FORMA-1.1.0/src/app.js FORMA-1.1.0/index.html FORMA-1.1.0/src/scanner/pose.js; do
            echo "--- $f ---"
            sed -n '1,260p' "$f"
          done
          echo '=== SCAN / COACH / PLAN REFERENCES ==='
          grep -RniE 'coach|gemini|scan|analyse|analy[sz]|bodycomp|plan|photo|camera' FORMA-1.1.0/src --include='*.js' | head -300

      - name: Simplify remaining user-facing copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('FORMA-1.1.0/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<small>Los datos se guardan localmente en este dispositivo.</small>', '')
          index.write_text(html, encoding='utf-8')
          app = Path('FORMA-1.1.0/src/app.js')
          js = app.read_text(encoding='utf-8')
          replacements = {
              'MODO DE PERFIL': 'PERFIL',
              'GRASA CORPORAL · ESTIMACIÓN HÍBRIDA': 'GRASA CORPORAL ESTIMADA',
              'MÚSCULO ESQUELÉTICO APENDICULAR': 'REFERENCIA MUSCULAR',
              'MÚSCULO APENDICULAR': 'REFERENCIA MUSCULAR',
              'Selecciona una referencia sexual compatible con las ecuaciones poblacionales para calcular este índice.': 'Completa tus datos para obtener una estimación orientativa.',
              'Se necesita una referencia sexual compatible con la ecuación.': 'Completa los datos disponibles para obtener una referencia.',
              'No aplicamos ecuaciones adultas ni confundimos masa libre de grasa con músculo.': 'En menores, las recomendaciones priorizan el crecimiento y el bienestar.',
              'Los percentiles no se calculan en esta versión.': 'Consulta el seguimiento con un profesional pediátrico.',
              'No hay una ecuación validada integrada para esta etapa.': 'Consulta el seguimiento con un profesional pediátrico.',
              'RMSE de estudio: ${fmt(pediatricFat.studyRmsePercentagePoints,2)} puntos a nivel de grupo; no es margen individual.': 'Es una estimación orientativa.',
              'Restaurar este respaldo reemplazará los datos locales actuales.': 'Restaurar este respaldo reemplazará los datos actuales.',
              'Entrenador': 'Coach'
          }
          for old, new in replacements.items():
              js = js.replace(old, new)
          app.write_text(js, encoding='utf-8')
          PY

      - name: Package on-device body analysis
        working-directory: FORMA-1.1.0
        run: |
          mkdir -p vendor/mediapipe models /tmp/forma-vision-package
          npm pack @mediapipe/tasks-vision@1.2.3 --pack-destination /tmp/forma-vision-package
          TARBALL="$(find /tmp/forma-vision-package -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          test -n "$TARBALL"
          tar -xzf "$TARBALL" --strip-components=1 -C vendor/mediapipe
          test -f vendor/mediapipe/vision_bundle.mjs
          test -d vendor/mediapipe/wasm
          cp vendor/mediapipe/vision_bundle.mjs vendor/mediapipe/vision_bundle.js
          test -f vendor/mediapipe/vision_bundle.js
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20             'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'             --output models/pose_landmarker_lite.task
          test -s models/pose_landmarker_lite.task
          mkdir -p android/app/src/main/assets/public
          cp -a src public vendor models android/app/src/main/assets/public/
          cp index.html manifest.webmanifest service-worker.js android/app/src/main/assets/public/
          npm run check
          npm run build

      - name: Configure Android entry point
        run: |
          sed -i 's/import android.app.Activity;/import androidx.activity.ComponentActivity;/' FORMA-1.1.0/android/app/src/main/java/com/forma/fitness/MainActivity.java
          sed -i 's/public class MainActivity extends Activity/public class MainActivity extends ComponentActivity/' FORMA-1.1.0/android/app/src/main/java/com/forma/fitness/MainActivity.java
          cat >> FORMA-1.1.0/android/app/build.gradle <<'GRADLE'

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          GRADLE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build FORMA 1.2 APK
        working-directory: FORMA-1.1.0/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FORMA-1.2.0-debug-apk
          path: FORMA-1.1.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
