name: Build FORMA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'FORMA-ANDROID-APK-BUILDER-1.1.0.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack FORMA Android project
        run: |
          test -f FORMA-ANDROID-APK-BUILDER-1.1.0.zip
          unzip -q FORMA-ANDROID-APK-BUILDER-1.1.0.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: FORMA-1.1.0/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FORMA-1.1.0-debug-apk
          path: FORMA-1.1.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
