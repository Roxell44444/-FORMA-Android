name: Deploy FORMA AI backend
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/worker.js'
      - 'backend/wrangler.toml'
      - 'backend/worker.test.mjs'
      - '.github/workflows/deploy-worker.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Check required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAD_API_KEY: ${{ secrets.CLAD_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$CLAD_API_KEY" || (echo "Missing CLAD_API_KEY" && exit 1)
      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml
      - name: Store provider keys as Cloudflare secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAD_API_KEY: ${{ secrets.CLAD_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --config wrangler.toml
          printf '%s' "$CLAD_API_KEY" | wrangler secret put CLAD_API_KEY --config wrangler.toml
      - name: Verify deployed Worker and Android CORS
        run: |
          set -euo pipefail
          URL="https://formaandroid.roxell-santiesteban.workers.dev"
          curl --fail --silent --show-error -D /tmp/forma-health.headers -o /tmp/forma-health.json \
            -H 'Origin: https://appassets.androidplatform.net' "$URL/health"
          grep -qi '^access-control-allow-origin: https://appassets.androidplatform.net' /tmp/forma-health.headers
          grep -q '"ok":true' /tmp/forma-health.json
          curl --fail --silent --show-error -D /tmp/forma-preflight.headers -o /dev/null \
            -X OPTIONS "$URL/api/coach" \
            -H 'Origin: https://appassets.androidplatform.net' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          grep -qi '^access-control-allow-origin: https://appassets.androidplatform.net' /tmp/forma-preflight.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/forma-preflight.headers
          grep -qi '^access-control-allow-headers:.*Content-Type' /tmp/forma-preflight.headers
          echo "Worker health and Android CORS preflight verified."
